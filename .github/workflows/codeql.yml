# -----------------------------------------------------------------------------
# OmniStream · CodeQL (Analisis estatico de seguridad)
#
# Escanea el codigo Java en busca de vulnerabilidades y errores de seguridad,
# tanto en cada cambio como de forma programada (deteccion de nuevas reglas).
#
# Ejes: Seguridad (deteccion de CVE/patrones inseguros) + Calidad + Trazabilidad.
# -----------------------------------------------------------------------------
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Confiabilidad: re-escaneo semanal (lunes 06:00 UTC) aunque no haya cambios,
    # para captar vulnerabilidades descubiertas despues del ultimo commit.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Necesario para publicar los hallazgos en la pestana Security > Code scanning.
      security-events: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java
          # 'security-and-quality' incluye reglas de seguridad y de mantenibilidad.
          queries: security-and-quality

      # Compilacion manual para que CodeQL analice exactamente lo que se construye.
      - name: Build
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9e8d0789d4a0fa9ceb6b1738f7e269594bdd67f0 # v3.28.9
        with:
          category: /language:java
