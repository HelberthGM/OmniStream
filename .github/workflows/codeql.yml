# -----------------------------------------------------------------------------
# OmniStream · CodeQL (Analisis estatico de seguridad)
#
# Escanea el codigo Java en busca de vulnerabilidades y errores de seguridad,
# tanto en cada cambio como de forma programada (deteccion de nuevas reglas).
#
# Ejes: Seguridad (deteccion de CVE/patrones inseguros) + Calidad + Trazabilidad.
# -----------------------------------------------------------------------------
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Confiabilidad: re-escaneo semanal (lunes 06:00 UTC) aunque no haya cambios,
    # para captar vulnerabilidades descubiertas despues del ultimo commit.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Necesario para publicar los hallazgos en la pestana Security > Code scanning.
      security-events: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java
          # 'security-and-quality' incluye reglas de seguridad y de mantenibilidad.
          queries: security-and-quality

      # Compilacion manual para que CodeQL analice exactamente lo que se construye.
      - name: Build
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:java
