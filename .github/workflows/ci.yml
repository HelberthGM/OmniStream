# -----------------------------------------------------------------------------
# OmniStream · CI (Integracion Continua)
#
# Objetivos cubiertos:
#   - Calidad:        build + tests + verificaciones en cada cambio.
#   - Seguridad:      permisos minimos, hardening del runner, sin secretos.
#   - Confiabilidad:  matriz de JDK 25, fail-fast desactivado, timeouts.
#   - Velocidad:      cache de Maven, cancelacion de ejecuciones redundantes.
#   - Trazabilidad:   artefactos de reportes + resumen en el job summary.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Seguridad: por defecto, el GITHUB_TOKEN solo puede leer. Cada job eleva
# permisos unicamente si los necesita (principio de minimo privilegio).
permissions:
  contents: read

# Velocidad: si llegan nuevos commits a la misma rama/PR, cancela la corrida
# anterior en curso para no desperdiciar minutos de runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # Confiabilidad: si una version de JDK falla, la otra sigue corriendo
      # para darnos informacion completa en un solo ciclo.
      fail-fast: false
      matrix:
        java: ['25']

    steps:
      # Seguridad: endurece el runner (egress controlado, deteccion de
      # manipulaciones). En 'audit' no bloquea; registra para analisis.
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Velocidad + Trazabilidad: setup-java gestiona la cache de ~/.m2 por
      # nosotros, invalidandola segun el hash de los pom.xml.
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build & test (batch, sin transferencia de progreso)
        run: mvn --batch-mode --no-transfer-progress --errors clean verify

      # Trazabilidad: conserva los reportes de pruebas aunque el build falle.
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-jdk-${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          retention-days: 7
          if-no-files-found: ignore

      # Trazabilidad: deja un resumen legible en la pestana del run.
      - name: Resumen
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### OmniStream CI — JDK ${{ matrix.java }}"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Evento: \`${{ github.event_name }}\`"
            echo "- Resultado del build: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
